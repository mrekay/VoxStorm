# Pushing a tag like v0.2.0 builds VoxStorm on Windows and publishes a GitHub release
# with the installers, the app.asar and voxstorm-update.json (used by the in-app updater);
# the mac and linux jobs then add the macOS .dmg / .zip and the Linux .AppImage / .deb files to the same release.
# The tag must match "version" in package.json:  npm version minor && git push --follow-tags
# A tag with a dash (v0.7.0-beta.1) makes a pre-release: downloadable, but no copy updates itself to it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "package.json $v != tag $GITHUB_REF_NAME"; exit 1; fi

      - run: npm ci

      - name: Build
        run: |
          node scripts/make-icon.js
          npx electron-builder --win --publish never

      - name: Update manifest
        run: node scripts/update-manifest.js

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # v0.7.0-beta.1 and the like: a pre-release, which the in-app updater never installs
          pre=""; case "$v" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "VoxStorm $v" --generate-notes $pre \
            "dist/VoxStorm-Setup-$v.exe" \
            "dist/VoxStorm-Portable-$v.exe" \
            "dist/voxstorm-app-$v.asar" \
            "dist/voxstorm-update.json"

  # macOS: .dmg and .zip for Apple Silicon (arm64) and Intel (x64), added to the release made above.
  # Ad-hoc signed, not notarized: first launch needs right-click → Open (see README).
  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm only installs node-pty's native package for the runner's own CPU; add the Intel one too
      - name: node-pty for x64
        run: npm install --no-save --force "@lydell/node-pty-darwin-x64@$(node -p "require('@lydell/node-pty/package.json').version")"

      - name: Build
        run: |
          node scripts/make-icon.js --size 1024
          npx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/VoxStorm-*-mac-*.dmg dist/VoxStorm-*-mac-*.zip --clobber

  # Linux: AppImage (updates itself in the app) and .deb (Debian / Ubuntu), x64, added to the same release.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          node scripts/make-icon.js --size 512
          npx electron-builder --linux --x64 --publish never

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/VoxStorm-*-linux-*.AppImage dist/VoxStorm-*-linux-*.deb --clobber
